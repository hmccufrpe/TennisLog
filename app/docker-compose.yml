# Local stack: PostgreSQL + ASP.NET Core API + Nginx frontend.
# Usage: infisical run --env=dev -- docker compose up --build   (or cp .env.example .env)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8080"   # Swagger (/swagger), /health and /metrics

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3080:80"

volumes:
  pgdata:
