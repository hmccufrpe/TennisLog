# Monitoring stack (runs on the monitoring instance, see infra/monitoring.tf).
# Prometheus scrapes /metrics of the app hosts, Loki receives the container logs
# shipped by Alloy, Grafana shows both with provisioned datasources and dashboard.
# prometheus/targets.json and .env (GF_SECURITY_ADMIN_PASSWORD) are written at boot.
services:
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "3001:9090" # host 3001: many networks block outbound 9090
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.10 # default single-node config (/etc/loki/local-config.yaml)
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
